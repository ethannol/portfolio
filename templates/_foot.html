<div class="foot">
  Built {{ built_at }} from the local checkouts. Every value shown is read from a project's results file at build time;
  Hover a dotted number to see its ledger key and the script that recorded it.
  The full list of resolved values is in <span class="mono">numbers.json</span>.
</div>
</div>
<script>
(function () {
  var blocks = document.querySelectorAll("code.language-mermaid");
  if (!blocks.length) return;
  var s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.4.1/mermaid.min.js";
  s.onload = function () {
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (document.documentElement.dataset.theme) dark = document.documentElement.dataset.theme === "dark";
    blocks.forEach(function (code) {
      var pre = code.parentNode, div = document.createElement("div");
      div.className = "mermaid"; div.textContent = code.textContent; pre.replaceWith(div);
    });
    mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "neutral", securityLevel: "strict",
      flowchart: { htmlLabels: true, useMaxWidth: true } });
    mermaid.run({ querySelector: ".mermaid" });
  };
  document.body.appendChild(s);
})();
</script>
{% if wrapper %}</body>
</html>
{% endif %}
