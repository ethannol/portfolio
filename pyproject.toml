[project]
name = "portfolio"
version = "0.1.0"
description = "Static console over the side-projects portfolio: reads each project's card and ledger, renders a site with every number traced to its source."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ethan Levy", email = "ethannol@gmail.com" }]
dependencies = ["jinja2>=3.1", "markdown>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
portfolio-build = "portfolio.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
